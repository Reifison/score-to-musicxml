services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-score_to_musicxml}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-score_to_musicxml}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      STORAGE_DIR: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs/promises'); const path=require('node:path'); const root=process.env.STORAGE_DIR||'/app/storage'; const mode=require('node:fs').constants.R_OK|require('node:fs').constants.W_OK|require('node:fs').constants.X_OK; Promise.all(['uploads','exports'].map((name)=>fs.access(path.join(root,name),mode))).catch((error)=>{console.error(error.message); process.exitCode=1;});"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      STORAGE_DIR: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: ["node", "apps/api/dist/workers/conversionWorker.js"]
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs/promises'); const path=require('node:path'); const root=process.env.STORAGE_DIR||'/app/storage'; const mode=require('node:fs').constants.R_OK|require('node:fs').constants.W_OK|require('node:fs').constants.X_OK; Promise.all(['uploads','exports'].map((name)=>fs.access(path.join(root,name),mode))).catch((error)=>{console.error(error.message); process.exitCode=1;});"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  storage_data:
  caddy_data:
  caddy_config:
