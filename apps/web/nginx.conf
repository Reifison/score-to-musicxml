server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        # Compress public build assets; private API responses stay outside this location.
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types application/javascript text/javascript application/wasm text/css image/svg+xml;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
